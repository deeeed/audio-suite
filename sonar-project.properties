sonar.projectKey=deeeed_expo-audio-stream
sonar.organization=deeeed

# packages/audio-studio/SettingsTests/ contains only symlinks to production
# sources plus a SwiftPM manifest, so the analyzer reads the same file twice —
# once at its real path and once through the link — and reports it as ~100%
# duplicated. Excluding the symlink tree keeps the real files analyzed exactly
# once. Nothing unique lives under Sources/ or Tests/ there.
sonar.exclusions=packages/audio-studio/SettingsTests/Sources/**,packages/audio-studio/SettingsTests/Tests/**
sonar.cpd.exclusions=packages/audio-studio/SettingsTests/**
