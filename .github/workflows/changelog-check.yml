name: Changelog Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge base to diff against the target branch.
          fetch-depth: 0

      - name: Classifier self-test
        run: node scripts/changelog-check/classify.test.js

      - name: Require a changelog entry for each touched package
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execFileSync } = require('child_process')
            const { findMissing } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/changelog-check/classify.js`
            )

            const labels = (context.payload.pull_request.labels || []).map((l) => l.name)
            if (labels.includes('skip-changelog')) {
              core.info('skip-changelog label present — nothing to enforce.')
              return
            }

            const base = context.payload.pull_request.base.sha
            const head = context.payload.pull_request.head.sha
            const git = (...args) => execFileSync('git', args).toString()

            let mergeBase
            let changed
            try {
              mergeBase = git('merge-base', base, head).trim()
              // --no-renames: rename detection reports only the destination, so a file
              // moved out of a package would erase the package-side path.
              changed = git('diff', '--name-only', '--no-renames', mergeBase, head)
                .split('\n')
                .filter(Boolean)
            } catch (e) {
              core.setFailed(
                `Could not compute the changed-file list between ${base} and ${head}: ${e.message}`
              )
              return
            }

            const listTree = (ref, dir) => {
              try {
                return git('ls-tree', '--name-only', `${ref}:${dir}`).split('\n').filter(Boolean)
              } catch {
                return []
              }
            }
            // Returns the parsed manifest, null when present-but-unparseable (which the
            // classifier treats as "enforce"), or undefined when absent.
            const manifestAt = (ref) => (pkg) => {
              let raw
              try {
                raw = git('show', `${ref}:packages/${pkg}/package.json`)
              } catch {
                return undefined
              }
              try {
                return JSON.parse(raw)
              } catch {
                core.warning(`packages/${pkg}/package.json is unparseable at ${ref}; enforcing.`)
                return null
              }
            }
            // A path in the diff only proves it was touched — a deletion counts too. Require
            // a real blob at head so deleting the changelog cannot pass as updating it.
            const existsAtHead = (path) => {
              try {
                return git('cat-file', '-t', `${head}:${path}`).trim() === 'blob'
              } catch {
                return false
              }
            }

            const missing = findMissing({
              changed,
              basePackages: listTree(mergeBase, 'packages'),
              headPackages: listTree(head, 'packages'),
              baseManifest: manifestAt(mergeBase),
              headManifest: manifestAt(head),
              existsAtHead,
            })

            if (missing.length === 0) {
              core.info('Every touched package has a changelog entry.')
              return
            }

            const details = missing
              .map((m) => {
                const via = m.owner === m.pkg ? '' : ` (documented in ${m.owner})`
                return `- **${m.pkg}**${via} — changed \`${m.example}\`, but \`${m.changelog}\` was ${m.reason}`
              })
              .join('\n')

            core.setFailed(
              `Missing changelog entries:\n${details}\n\n` +
                `Add an entry under "## [Unreleased]" in each listed CHANGELOG.md, ` +
                `or apply the "skip-changelog" label if this PR cannot affect consumers ` +
                `(for example a release version bump).`
            )
