name: Changelog Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge base to diff against the target branch.
          fetch-depth: 0

      - name: Self-test
        run: |
          node scripts/changelog-check/changelog.test.js
          node scripts/changelog-check/classify.test.js

      - name: Require a changelog entry for each touched package
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execFileSync } = require('child_process')
            const dir = `${process.env.GITHUB_WORKSPACE}/scripts/changelog-check`
            const { findMissing } = require(`${dir}/classify.js`)
            const { hasNewUnreleasedEntry } = require(`${dir}/changelog.js`)

            const labels = (context.payload.pull_request.labels || []).map((l) => l.name)
            if (labels.includes('skip-changelog')) {
              core.info('skip-changelog label present — nothing to enforce.')
              return
            }

            const base = context.payload.pull_request.base.sha
            const head = context.payload.pull_request.head.sha
            const git = (...args) => execFileSync('git', args).toString()

            let mergeBase
            let changed
            try {
              mergeBase = git('merge-base', base, head).trim()
              // -z: paths with non-ASCII or newline characters are otherwise C-quoted, and
              // a quoted path no longer starts with "packages/". --no-renames: rename
              // detection reports only the destination, erasing the package-side path.
              changed = git('diff', '--name-only', '--no-renames', '-z', mergeBase, head)
                .split('\0')
                .filter(Boolean)
            } catch (e) {
              core.setFailed(`Could not diff ${base}..${head}: ${e.message}`)
              return
            }

            const show = (ref, path) => {
              try {
                return git('show', `${ref}:${path}`)
              } catch {
                return ''
              }
            }
            const listTree = (ref, dir) => {
              try {
                return git('ls-tree', '--name-only', '-z', `${ref}:${dir}`)
                  .split('\0')
                  .filter(Boolean)
              } catch {
                return []
              }
            }
            // Parsed manifest, null when present but unparseable (enforced), undefined when absent.
            const manifestAt = (ref) => (pkg) => {
              const raw = show(ref, `packages/${pkg}/package.json`)
              if (!raw) return undefined
              try {
                return JSON.parse(raw)
              } catch {
                core.warning(`packages/${pkg}/package.json is unparseable at ${ref}; enforcing.`)
                return null
              }
            }

            // A path in the diff only proves it was touched — a deletion looks the same as
            // an edit, and a symlink is a blob too. Require a regular file that gained a
            // bullet under "## [Unreleased]".
            const changelogUpdated = (path) => {
              const entry = git('ls-tree', head, '--', path).trim()
              if (!entry) return false
              const mode = entry.split('\t')[0].split(/\s+/)[0]
              if (mode !== '100644' && mode !== '100755') return false
              return hasNewUnreleasedEntry(show(mergeBase, path), show(head, path))
            }

            const missing = findMissing({
              changed,
              basePackages: listTree(mergeBase, 'packages'),
              headPackages: listTree(head, 'packages'),
              baseManifest: manifestAt(mergeBase),
              headManifest: manifestAt(head),
              changelogUpdated,
            })

            if (missing.length === 0) {
              core.info('Every touched package has a changelog entry.')
              return
            }

            const details = missing
              .map((m) => {
                const via = m.owner === m.pkg ? '' : ` (documented in ${m.owner})`
                return `- **${m.pkg}**${via} — changed \`${m.example}\`, but \`${m.changelog}\` ${m.reason}`
              })
              .join('\n')

            core.setFailed(
              `Missing changelog entries:\n${details}\n\n` +
                `Add a bullet under "## [Unreleased]" in each listed CHANGELOG.md, ` +
                `or apply the "skip-changelog" label if this PR cannot affect consumers ` +
                `(for example a release version bump).`
            )
